name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  web-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: make openapi-check

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: scripts/build-skill-binaries.sh
      - run: git diff --exit-code -- skills/manifold/bin
      - run: make skill-check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate-compose.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: python3 scripts/test-deploy-production.py
      - run: git init -q /tmp/brain
      - run: git -C /tmp/brain remote add origin https://github.com/inite-ai/inite-brain-service.git
      - run: git -C /tmp/brain fetch -q --depth 1 origin a567f6960c031b916549699fec7b89423c650d1e
      - run: git -C /tmp/brain checkout -q FETCH_HEAD
      - run: test "$(git -C /tmp/brain rev-parse HEAD)" = a567f6960c031b916549699fec7b89423c650d1e
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/openai-api-key-format.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/openai-api-key-format.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/document-origin-identity.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/document-origin-identity.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/worker-startup-order.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/worker-startup-order.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/corroborated-commit-ref.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/corroborated-commit-ref.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/failed-run-retry.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/failed-run-retry.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/extraction-completion.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/extraction-completion.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/fatal-signal-default.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/fatal-signal-default.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/openai-chat-extra-body.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/openai-chat-extra-body.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/entity-fact-read-index-hints.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/entity-fact-read-index-hints.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/resolve-fact-entity-index.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/resolve-fact-entity-index.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/selective-entity-fact-indexes.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/selective-entity-fact-indexes.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/derived-stale-cascade.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/derived-stale-cascade.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/edge-retraction.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/edge-retraction.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/revive-superseded-index.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/revive-superseded-index.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/knn-empty-result-fallback.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/knn-empty-result-fallback.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/hnsw-provision-early-tenants.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/hnsw-provision-early-tenants.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/search-throttle-limit.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/search-throttle-limit.patch"
      - run: git -C /tmp/brain diff --check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - run: scripts/integration.sh

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
