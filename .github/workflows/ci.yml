name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  web-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: make openapi-check

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: scripts/build-skill-binaries.sh
      - run: git diff --exit-code -- skills/manifold/bin
      - run: make skill-check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate-compose.sh
      - run: git clone --branch v0.8.1 --depth 1 https://github.com/inite-ai/inite-brain-service.git /tmp/brain
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/openai-base-url.patch"
      - run: git -C /tmp/brain apply "$GITHUB_WORKSPACE/deploy/brain/openai-base-url.patch"
      - run: git -C /tmp/brain apply --check "$GITHUB_WORKSPACE/deploy/brain/scoped-session-recovery.patch"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: scripts/integration.sh

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
