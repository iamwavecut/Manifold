name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  web-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: make openapi-check

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: scripts/build-skill-binaries.sh
      - run: git diff --exit-code -- skills/manifold/bin
      - run: make skill-check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/validate-compose.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: python3 scripts/test-deploy-production.py
      - run: python3 scripts/test-geta-release-request.py
      - run: python3 scripts/test-brain-flags.py
      - run: git init -q /tmp/brain
      - run: git -C /tmp/brain remote add origin https://github.com/inite-ai/inite-brain-service.git
      - run: git -C /tmp/brain fetch -q --depth 1 origin 6ba986054a546c71c93c39e0e118e0f3dddc983f
      - run: git -C /tmp/brain checkout -q FETCH_HEAD
      - run: test "$(git -C /tmp/brain rev-parse HEAD)" = 6ba986054a546c71c93c39e0e118e0f3dddc983f
      - run: scripts/brain-apply-patches.sh /tmp/brain
      - run: git -C /tmp/brain diff --check
      # The image pins Brain's previous flag defaults; a changed catalog needs new pins.
      - run: docker build --target builder -t brain-builder -f deploy/brain/Dockerfile .
      - run: scripts/brain-catalog.sh brain-builder > /tmp/brain-catalog.json
      - run: python3 scripts/brain-flags.py --check --baseline deploy/brain/flags/baseline.json --current /tmp/brain-catalog.json --adopt deploy/brain/flags/adopt.txt --out deploy/brain/flags/defaults.env

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - run: scripts/integration.sh

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
