info:
  description: A self-hosted knowledge and memory layer for AI agents.
  title: Manifold API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/api-keys:
    get:
      operationId: list-api-keys
      parameters:
        - explode: false
          in: query
          name: cursor
          schema:
            pattern: ^c[0-9a-z]+$
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAPIKey"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: List API-key records
      tags:
        - Authentication
    post:
      operationId: create-api-key
      parameters:
        - description: A caller-generated key that makes this mutation safe to retry.
          in: header
          name: Idempotency-Key
          schema:
            description: A caller-generated key that makes this mutation safe to retry.
            maxLength: 128
            minLength: 8
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create-api-keyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
          description: Created
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      summary: Create an API key
      tags:
        - Authentication
  /api/v1/api-keys/{id}:
    delete:
      operationId: delete-api-key
      parameters:
        - description: A caller-generated key that makes this mutation safe to retry.
          in: header
          name: Idempotency-Key
          schema:
            description: A caller-generated key that makes this mutation safe to retry.
            maxLength: 128
            minLength: 8
            type: string
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
