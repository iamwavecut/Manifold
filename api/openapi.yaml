components:
  schemas:
    APIKey:
      additionalProperties: false
      properties:
        capabilities:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          type: string
      required:
        - id
        - capabilities
        - created_at
      type: object
    Blocker:
      additionalProperties: false
      properties:
        location:
          type: string
        reason:
          type: string
        resource:
          type: string
      required:
        - resource
        - reason
      type: object
    Build-contextRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Build-contextRequest.json
          format: uri
          readOnly: true
          type: string
        graph_depth:
          default: 2
          format: int64
          maximum: 5
          minimum: 0
          type: integer
        include_history:
          type: boolean
        query:
          maxLength: 8000
          minLength: 1
          type: string
        scope:
          maxLength: 512
          type: string
        scope_glob:
          description: Filter canonical document paths with slash-aware *, ?, and ** glob syntax.
          maxLength: 1024
          type: string
        source_types:
          items:
            type: string
          type:
            - array
            - "null"
        token_budget:
          default: 4000
          format: int64
          maximum: 50000
          minimum: 50
          type: integer
      required:
        - query
        - token_budget
      type: object
    Conflict:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Conflict.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        fact_a_id:
          type: string
        fact_b_id:
          type: string
        id:
          type: string
        resolution:
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - fact_a_id
        - fact_b_id
        - status
        - created_at
        - updated_at
      type: object
    Create-api-keyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-api-keyRequest.json
          format: uri
          readOnly: true
          type: string
        capabilities:
          items:
            type: string
          maxItems: 7
          minItems: 1
          type:
            - array
            - "null"
        id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
      required:
        - id
        - capabilities
      type: object
    Create-entityRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-entityRequest.json
          format: uri
          readOnly: true
          type: string
        id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        kind:
          maxLength: 80
          minLength: 1
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          maxLength: 240
          minLength: 1
          type: string
      required:
        - name
        - kind
      type: object
    Create-factRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-factRequest.json
          format: uri
          readOnly: true
          type: string
        confidence:
          format: double
          maximum: 1
          minimum: 0
          type: number
        entity_id:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        object:
          maxLength: 2000
          minLength: 1
          type: string
        predicate:
          maxLength: 256
          minLength: 1
          type: string
        source_document_id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        source_revision:
          pattern: ^r[1-9][0-9]*$
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - entity_id
        - predicate
        - object
      type: object
    Create-relationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-relationRequest.json
          format: uri
          readOnly: true
          type: string
        confidence:
          format: double
          maximum: 1
          minimum: 0
          type: number
        from_entity_id:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        predicate:
          maxLength: 256
          minLength: 1
          type: string
        to_entity_id:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
      required:
        - from_entity_id
        - to_entity_id
        - predicate
      type: object
    Create-rename-planRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-rename-planRequest.json
          format: uri
          readOnly: true
          type: string
        operations:
          items:
            $ref: "#/components/schemas/RenameOperation"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - operations
      type: object
    Create-ui-sessionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-ui-sessionRequest.json
          format: uri
          readOnly: true
          type: string
        api_key:
          maxLength: 512
          minLength: 16
          type: string
      required:
        - api_key
      type: object
    Create-ui-sessionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Create-ui-sessionResponse.json
          format: uri
          readOnly: true
          type: string
        capabilities:
          items:
            type: string
          type:
            - array
            - "null"
        csrf_token:
          type: string
        expires_at:
          type: string
      required:
        - csrf_token
        - capabilities
        - expires_at
      type: object
    CreateDocumentRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateDocumentRequestBody.json
          format: uri
          readOnly: true
          type: string
        content:
          maxLength: 5000000
          type: string
        folder_id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        folder_path:
          maxLength: 1024
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$
          type: string
        format:
          default: markdown
          enum:
            - markdown
            - text
            - json
            - yaml
            - toml
            - javascript
            - typescript
            - python
          type: string
        id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        metadata:
          additionalProperties: {}
          type: object
        tags:
          items:
            type: string
          maxItems: 64
          type:
            - array
            - "null"
        title:
          maxLength: 240
          minLength: 1
          type: string
      required:
        - title
        - content
      type: object
    CreateFolderRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateFolderRequestBody.json
          format: uri
          readOnly: true
          type: string
        id:
          description: Optional semantic slug. Generated from name when omitted.
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          maxLength: 160
          minLength: 1
          type: string
        parent_id:
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        summary:
          maxLength: 4000
          type: string
      required:
        - name
      type: object
    CreateFolderResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateFolderResponse.json
          format: uri
          readOnly: true
          type: string
        folder:
          $ref: "#/components/schemas/Folder"
      required:
        - folder
      type: object
    CreateKeyResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateKeyResponse.json
          format: uri
          readOnly: true
          type: string
        key:
          $ref: "#/components/schemas/APIKey"
        secret:
          description: Shown once. Store it securely; Manifold only persists an Argon2id hash.
          type: string
      required:
        - key
        - secret
      type: object
    Document:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Document.json
          format: uri
          readOnly: true
          type: string
        content:
          type: string
        content_hash:
          type: string
        created_at:
          format: date-time
          type: string
        etag:
          type: string
        folder_id:
          type: string
        format:
          type: string
        id:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        revision:
          type: string
        status:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - title
        - format
        - content_hash
        - revision
        - status
        - etag
        - created_at
        - updated_at
      type: object
    DocumentAccepted:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DocumentAccepted.json
          format: uri
          readOnly: true
          type: string
        document:
          $ref: "#/components/schemas/Document"
        folders_created:
          items:
            $ref: "#/components/schemas/Folder"
          type:
            - array
            - "null"
        job:
          $ref: "#/components/schemas/Job"
      required:
        - document
        - job
      type: object
    Entity:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Entity.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - kind
        - created_at
        - updated_at
      type: object
    Error:
      additionalProperties: false
      examples:
        - code: api_key_secret_not_replayable
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/api_key_secret_not_replayable
          remediation:
            steps:
              - List API-key records and confirm that the requested key exists.
              - Revoke it if the plaintext secret was lost.
              - Create a replacement with a new Idempotency-Key.
            summary: Use the original secret or replace the key if that one-time response was lost.
          request_id: d5vqh9idc6b5u5sctq00
          resource: /api/v1/api-keys
          retryable: false
          status: 409
          title: api key secret not replayable
          type: http://localhost:8080/errors/api_key_secret_not_replayable
        - code: cannot_revoke_current_key
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/cannot_revoke_current_key
          remediation:
            steps:
              - Create a second admin key.
              - Use it to revoke the original key.
            summary: Authenticate with another administrator key.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: cannot revoke current key
          type: http://localhost:8080/errors/cannot_revoke_current_key
        - code: csrf_failed
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/csrf_failed
          remediation:
            steps:
              - Create a new UI session if needed.
              - Send its csrf_token in X-CSRF-Token.
            summary: Use the CSRF token paired with the current browser session.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 403
          title: csrf failed
          type: http://localhost:8080/errors/csrf_failed
        - code: dependency_unavailable
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/dependency_unavailable
          remediation:
            steps:
              - Inspect /api/v1/status.
              - Fix provider or network configuration.
              - Retry the failed job.
            summary: Restore the named dependency and retry.
          request_id: d5vqh9idc6b5u5sctq00
          retry_after: 30s
          retryable: true
          status: 503
          title: dependency unavailable
          type: http://localhost:8080/errors/dependency_unavailable
        - code: error_code_not_found
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/error_code_not_found
          remediation:
            steps:
              - Read the original response code field.
              - Open documentation_url from that response.
            summary: Use a code returned by a Manifold error response.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 404
          title: error code not found
          type: http://localhost:8080/errors/error_code_not_found
        - code: etag_mismatch
          current_etag: "\"v3\""
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/etag_mismatch
          remediation:
            steps:
              - GET the resource.
              - Apply the intended change to the latest state.
              - Send its ETag in If-Match.
            summary: Refresh the resource before retrying the update.
          request_id: d5vqh9idc6b5u5sctq00
          resource: /api/v1/documents/agent-memory
          retryable: false
          status: 409
          title: etag mismatch
          type: http://localhost:8080/errors/etag_mismatch
        - code: folder_path_conflict
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/folder_path_conflict
          meta:
            existing_path: shared/operations/runbooks
            requested_path: tasks/incident-42/runbooks
            segment: runbooks
          remediation:
            steps:
              - Inspect meta.existing_path and the surrounding tree.
              - Choose whether the knowledge belongs in the existing branch.
              - Retry with a distinct segment only when the concepts are genuinely different.
            summary: Reuse the canonical folder path or choose a distinct slug for the new branch.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: folder path conflict
          type: http://localhost:8080/errors/folder_path_conflict
        - code: idempotency_key_reused
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/idempotency_key_reused
          remediation:
            steps:
              - Keep the original request unchanged when retrying.
              - Use a new Idempotency-Key for corrected or different mutation content.
            summary: Use the original key only for an exact replay.
          request_id: d5vqh9idc6b5u5sctq00
          resource: /api/v1/documents
          retryable: false
          status: 409
          title: idempotency key reused
          type: http://localhost:8080/errors/idempotency_key_reused
        - code: internal_error
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/internal_error
          remediation:
            steps:
              - Inspect the related job if one exists.
              - Search structured logs by request_id.
              - Retry only when the mutation outcome is known.
            summary: Report request_id to the operator before repeating a mutation.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 500
          title: internal error
          type: http://localhost:8080/errors/internal_error
        - code: invalid_api_key
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/invalid_api_key
          remediation:
            steps:
              - "Use Authorization: Bearer <key>."
              - Ask an administrator to replace a revoked key.
            summary: Send a valid Manifold API key.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 401
          title: invalid api key
          type: http://localhost:8080/errors/invalid_api_key
        - code: invalid_request
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/invalid_request
          remediation:
            steps:
              - Send valid JSON.
              - "Use Content-Type: application/json for JSON bodies."
            summary: Correct the request syntax or content type.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 400
          title: invalid request
          type: http://localhost:8080/errors/invalid_request
          violations:
            - code: required
              expected: a non-empty string, for example "Agent memory"
              message: Title is required.
              pointer: /body/title
        - allowed_states:
            - failed
            - partially_ready
          code: invalid_state_transition
          current_state: ready
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/invalid_state_transition
          remediation:
            steps:
              - Inspect current_state and allowed_states.
              - Wait for an active job or select an allowed transition.
            summary: Perform an action allowed by the current state.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: invalid state transition
          type: http://localhost:8080/errors/invalid_state_transition
        - code: job_failed
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/job_failed
          job: /api/v1/jobs/d5vqh9idc6b5u5sctq00
          remediation:
            steps:
              - GET the job.
              - Follow error.remediation.
              - POST the retry endpoint after correcting the cause.
            summary: Inspect the job error, correct the cause, and retry the job.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 500
          title: job failed
          type: http://localhost:8080/errors/job_failed
        - code: missing_capability
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/missing_capability
          remediation:
            steps:
              - Inspect required_capabilities.
              - Ask an administrator to create a suitable key.
            summary: Use a key with all required capabilities.
          request_id: d5vqh9idc6b5u5sctq00
          required_capabilities:
            - write_documents
          retryable: false
          status: 403
          title: missing capability
          type: http://localhost:8080/errors/missing_capability
        - code: request_failed
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/request_failed
          remediation:
            steps:
              - Search structured logs by request_id.
              - Retry only when remediation is complete.
            summary: Inspect request_id and correct the reported server-side cause.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 500
          title: request failed
          type: http://localhost:8080/errors/request_failed
        - code: resource_not_found
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/resource_not_found
          meta:
            renamed_to: new-slug
            requested_slug: old-slug
            resource_type: document
          remediation:
            steps:
              - List the relevant resource type.
              - Check for a recent rename.
            summary: Use an existing canonical slug or XID.
          request_id: d5vqh9idc6b5u5sctq00
          resource: /api/v1/documents/old-slug
          retryable: false
          status: 404
          title: resource not found
          type: http://localhost:8080/errors/resource_not_found
        - code: slug_taken
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/slug_taken
          remediation:
            steps:
              - Read suggested_slug.
              - Retry with that slug and a new Idempotency-Key.
            summary: Choose the suggested available slug or another unused slug.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          suggested_slug: agent-memory-2
          title: slug taken
          type: http://localhost:8080/errors/slug_taken
        - code: stale_rename_plan
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/stale_rename_plan
          remediation:
            steps:
              - POST the same operations to /api/v1/rename-plans.
              - Review the new preview.
              - Apply the new plan XID.
            summary: Create a new rename preview.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: stale rename plan
          type: http://localhost:8080/errors/stale_rename_plan
        - code: state_conflict
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/state_conflict
          remediation:
            steps:
              - Read the latest resource.
              - Choose a non-conflicting operation.
              - Retry with a new Idempotency-Key.
            summary: Refresh the resource and retry without conflicting with its current state.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: state conflict
          type: http://localhost:8080/errors/state_conflict
        - code: storage_unavailable
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/storage_unavailable
          remediation:
            steps:
              - Check /ready.
              - Check volume permissions and free space.
              - Retry after readiness is restored.
            summary: Restore access to the SQLite data volume before retrying.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: true
          status: 503
          title: storage unavailable
          type: http://localhost:8080/errors/storage_unavailable
        - blockers:
            - location: archive@r2
              reason: Binary content cannot be safely rewritten.
              resource: documents/archive
          code: unrewritable_reference
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/unrewritable_reference
          remediation:
            steps:
              - Inspect blockers.
              - Replace the binary asset with a rewritable text source or edit it externally.
              - Create a new preview.
            summary: Remove or convert every blocking binary reference.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 409
          title: unrewritable reference
          type: http://localhost:8080/errors/unrewritable_reference
        - code: validation_failed
          detail: A safe request-specific explanation is returned here.
          documentation_url: http://localhost:8080/docs/errors/validation_failed
          remediation:
            steps:
              - Use each JSON Pointer to locate the invalid value.
              - Match the expected constraint shown in the violation.
            summary: Correct every violation before retrying.
          request_id: d5vqh9idc6b5u5sctq00
          retryable: false
          status: 422
          title: validation failed
          type: http://localhost:8080/errors/validation_failed
          violations:
            - code: required
              expected: a non-empty string, for example "Agent memory"
              message: Title is required.
              pointer: /body/title
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Error.json
          format: uri
          readOnly: true
          type: string
