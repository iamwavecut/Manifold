{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_API_KEY}",
    "cors_origins": []
  },
  "storage": {
    "workspace": "/app/.openviking/data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "model": "${OPENAI_EMBEDDING_MODEL}",
      "api_key": "${OPENAI_API_KEY}",
      "api_base": "${OPENAI_BASE_URL}",
      "dimension": ${OPENAI_EMBEDDING_DIMENSIONS},
      "input": "text"
    },
    "text_source": "content_only"
  },
  "vlm": {
    "provider": "openai",
    "model": "${OPENAI_CHAT_MODEL}",
    "api_key": "${OPENAI_API_KEY}",
    "api_base": "${OPENAI_BASE_URL}",
    "temperature": 0.0,
    "thinking": false
  },
  "log": {
    "level": "INFO",
    "format": "%(asctime)s - %(name)s - %(levelname)s - %(message)s",
    "output": "stdout",
    "rotation": true
  }
}
