name: manifold-integration

services:
  provider:
    build:
      context: .
      dockerfile: deploy/test-provider/Dockerfile
    healthcheck:
      test: ["CMD", "/usr/local/bin/provider", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  manifold:
    environment:
      MANIFOLD_PUBLIC_URL: http://127.0.0.1:${MANIFOLD_PORT:-18080}
      # The convergence phase shortens it to give up on a held extraction.
      MANIFOLD_EXTRACTION_TIMEOUT: ${MANIFOLD_INTEGRATION_EXTRACTION_TIMEOUT:-3m}
      MANIFOLD_PROVIDER_RETRY_INTERVAL: 5s
      # The reseed phase moves Manifold to an empty index file.
      MANIFOLD_INDEX_DB_PATH: ${MANIFOLD_INTEGRATION_INDEX_PATH:-/var/lib/manifold/index.db}
      OPENAI_BASE_URL: http://provider:8081/v1
      OPENAI_API_KEY: deterministic-provider-key
      OPENAI_CHAT_MODEL: deterministic-chat
      OPENAI_EMBEDDING_MODEL: deterministic-embedding
      OPENAI_CHAT_EXTRA_BODY: '{"reasoning":{"enabled":false},"provider":{"require_parameters":true}}'
    depends_on:
      provider:
        condition: service_healthy
