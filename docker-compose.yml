name: manifold

services:
  manifold:
    build:
      context: .
      args:
        VERSION: ${MANIFOLD_BUILD_VERSION:-}
        COMMIT: ${MANIFOLD_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    init: true
    environment:
      MANIFOLD_ADDR: :8080
      MANIFOLD_DB_PATH: /var/lib/manifold/manifold.db
      MANIFOLD_PUBLIC_URL: ${MANIFOLD_PUBLIC_URL:-http://localhost:8080}
      MANIFOLD_BOOTSTRAP_API_KEY: ${MANIFOLD_BOOTSTRAP_API_KEY:?set MANIFOLD_BOOTSTRAP_API_KEY}
      MANIFOLD_LOG_LEVEL: ${MANIFOLD_LOG_LEVEL:-info}
      MANIFOLD_MAX_BODY_BYTES: ${MANIFOLD_MAX_BODY_BYTES:-5242880}
      MANIFOLD_HTTP_TIMEOUT: ${MANIFOLD_HTTP_TIMEOUT:-30s}
      MANIFOLD_OPENVIKING_WRITE_TIMEOUT: ${MANIFOLD_OPENVIKING_WRITE_TIMEOUT:-5m}
      MANIFOLD_BRAIN_INGEST_TIMEOUT: ${MANIFOLD_BRAIN_INGEST_TIMEOUT:-2m}
      MANIFOLD_BRAIN_EXTRACTION_TIMEOUT: ${MANIFOLD_BRAIN_EXTRACTION_TIMEOUT:-30m}
      OPENVIKING_URL: http://openviking:1933
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:?set OPENVIKING_API_KEY}
      BRAIN_URL: http://brain:3000
      BRAIN_API_KEY: ${BRAIN_API_KEY:?set BRAIN_API_KEY}
    ports:
      - "${MANIFOLD_PORT:-8080}:8080"
    volumes:
      - manifold-data:/var/lib/manifold
    depends_on:
      openviking:
        condition: service_healthy
      brain:
        condition: service_healthy
    networks:
      - private
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.22@sha256:f52ab2c309e46e47a746ffc5715bb280111588ff27bc7c9ae62ef5b915df9de1
    restart: unless-stopped
    init: true
    environment:
      OPENVIKING_CONFIG_FILE: /app/.openviking/ov.conf
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:?set OPENVIKING_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENVIKING_VLM_EXTRA_BODY: ${OPENAI_CHAT_EXTRA_BODY:-{}}
    volumes:
      - ./deploy/openviking/ov.conf:/app/.openviking/ov.conf:ro
      - openviking-data:/app/.openviking/data
    networks:
      - private
      - provider
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1933/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  brain:
    build:
      context: .
      dockerfile: deploy/brain/Dockerfile
      args:
        BRAIN_REF: 0f3d16db0d175794b79b73ef186351aa9f2da3c0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PORT: 3000
      SURREALDB_URL: ws://surrealdb:8000
      SURREALDB_USERNAME: ${SURREALDB_USERNAME:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD}
      SURREALDB_NAMESPACE: manifold
      SURREALDB_SCOPED_USER: brain_caller
      SURREALDB_SCOPED_PASS: ${SURREALDB_SCOPED_PASS:?set SURREALDB_SCOPED_PASS}
      BRAIN_BASELINES_DIR: /app/.cache/baselines
      BRAIN_API_KEYS: ${BRAIN_API_KEYS_JSON:?set BRAIN_API_KEYS_JSON}
      FORGET_HMAC_KEY: ${FORGET_HMAC_KEY:?set FORGET_HMAC_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_MS: ${BRAIN_OPENAI_TIMEOUT_MS:-300000}
      OPENAI_MAX_RETRIES: ${BRAIN_OPENAI_MAX_RETRIES:-1}
      OPENAI_CHAT_EXTRA_BODY: ${OPENAI_CHAT_EXTRA_BODY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      EXTRACTOR_MAX_COMPLETION_TOKENS: ${BRAIN_EXTRACTOR_MAX_COMPLETION_TOKENS:-16384}
      EXTRACTOR_SC_PASSES: ${BRAIN_EXTRACTOR_SC_PASSES:-3}
      THROTTLE_LIMIT: ${BRAIN_THROTTLE_LIMIT:-600}
      THROTTLE_EXPENSIVE_LIMIT: ${BRAIN_THROTTLE_EXPENSIVE_LIMIT:-600}
      BRAIN_HEALTH_RESTART_FAILURES: ${BRAIN_HEALTH_RESTART_FAILURES:-20}
      DOCUMENT_INGEST_ENABLED: "1"
      DOCUMENT_MULTI_INDEXER_ENABLED: "1"
      FACTS_API_ENABLED: "1"
      # Brain v2.3 stores every conversational turn verbatim by default.
      # Manifold sends documents, not turns, so keep that store closed.
      EPISODE_SUBSTRATE_ENABLED: "0"
    volumes:
      - brain-cache:/app/.cache
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - private
      - provider
    healthcheck:
      # Compose does not restart unhealthy containers. The probe terminates
      # a Brain process that stops serving after it was healthy.
      test: ["CMD", "brain-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  surrealdb:
    image: surrealdb/surrealdb:v3.3.0@sha256:681c6c22c287421b5c7d99e0fde79b6e0d32c36c1ddeaab2762a1661cb04cd20
    restart: unless-stopped
    user: root
    command:
      - start
      - --user=${SURREALDB_USERNAME:-root}
      - --pass=${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD}
      - --bind=0.0.0.0:8000
      - rocksdb:/data/db
    volumes:
      - surrealdb-data:/data/db
    networks:
      - private
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 10s
      timeout: 5s
      retries: 8

networks:
  edge:
  provider:
  private:
    internal: true

volumes:
  manifold-data:
  openviking-data:
  brain-cache:
  surrealdb-data:
