name: manifold

# Docker keeps json-file logs without a size limit. The local driver stores
# them compressed and keeps at most three 10 MB files per container.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  manifold:
    build:
      context: .
      args:
        VERSION: ${MANIFOLD_BUILD_VERSION:-}
        COMMIT: ${MANIFOLD_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    logging: *logging
    init: true
    stop_grace_period: 20s
    # One process keeps the canonical database and the derived index. The Go
    # runtime collects garbage harder as the heap nears GOMEMLIMIT, well
    # before the container limit.
    mem_limit: ${MANIFOLD_MEMORY_LIMIT:-1g}
    environment:
      GOMEMLIMIT: ${MANIFOLD_GOMEMLIMIT:-384MiB}
      MANIFOLD_ADDR: :8080
      MANIFOLD_DB_PATH: /var/lib/manifold/manifold.db
      MANIFOLD_INDEX_DB_PATH: /var/lib/manifold/index.db
      MANIFOLD_PUBLIC_URL: ${MANIFOLD_PUBLIC_URL:-http://localhost:8080}
      MANIFOLD_BOOTSTRAP_API_KEY: ${MANIFOLD_BOOTSTRAP_API_KEY:?set MANIFOLD_BOOTSTRAP_API_KEY}
      MANIFOLD_LOG_LEVEL: ${MANIFOLD_LOG_LEVEL:-info}
      MANIFOLD_MAX_BODY_BYTES: ${MANIFOLD_MAX_BODY_BYTES:-5242880}
      MANIFOLD_PROVIDER_TIMEOUT: ${MANIFOLD_PROVIDER_TIMEOUT:-3m}
      MANIFOLD_EXTRACTION_TIMEOUT: ${MANIFOLD_EXTRACTION_TIMEOUT:-30m}
      MANIFOLD_EXTRACTION_CONCURRENCY: ${MANIFOLD_EXTRACTION_CONCURRENCY:-4}
      MANIFOLD_EMBEDDING_DIMENSIONS: ${MANIFOLD_EMBEDDING_DIMENSIONS:-512}
      MANIFOLD_PROVIDER_RETRY_INTERVAL: ${MANIFOLD_PROVIDER_RETRY_INTERVAL:-15m}
      MANIFOLD_WORKER_CONCURRENCY: ${MANIFOLD_WORKER_CONCURRENCY:-2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_CHAT_EXTRA_BODY: ${OPENAI_CHAT_EXTRA_BODY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "${MANIFOLD_PORT:-8080}:8080"
    volumes:
      - manifold-data:/var/lib/manifold
    healthcheck:
      test: ["CMD", "/usr/local/bin/manifold", "healthcheck"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 30s

volumes:
  manifold-data:
